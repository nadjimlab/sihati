
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" dir="rtl">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="1050" cy="120" r="280" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="320" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="400" fill="#0ea5e9" opacity="0.06" filter="url(#glow)"/>

  <!-- Subtle Tech Grid Lines -->
  <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#blueGrad)"/>

  <!-- Container Card -->
  <rect x="60" y="55" width="1080" height="520" rx="32" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="60" y="55" width="1080" height="520" rx="32" fill="none" stroke="url(#glowGrad)" stroke-width="1"/>

  <!-- Header Section with Logo & Brand -->
  <g transform="translate(1040, 110)">
    <!-- App Logo Icon Outer -->
    <rect x="-100" y="0" width="100" height="100" rx="26" fill="url(#blueGrad)" filter="url(#softShadow)"/>

    <!-- Heart & Pulse Vector Inside Logo -->
    <path d="M-50 28 C-68 12 -82 32 -72 50 C-62 68 -50 82 -50 82 C-50 82 -38 68 -28 50 C-18 32 -32 12 -50 28 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M-78 52 L-64 52 L-58 38 L-50 66 L-44 46 L-38 52 L-22 52" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Live Green Dot on Logo -->
    <circle cx="-16" cy="16" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(920, 115)">
    <rect x="-240" y="0" width="240" height="38" rx="19" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="-20" cy="19" r="5" fill="#38bdf8"/>
    <text x="-35" y="24" font-family="Tajawal, sans-serif, 'Segoe UI', Arial" font-size="16" font-weight="bold" fill="#7dd3fc" text-anchor="start">المنصة الطبية الأولى بالولاية</text>
  </g>

  <!-- Main Title -->
  <text x="920" y="205" font-family="Tajawal, sans-serif, 'Segoe UI', Arial" font-size="52" font-weight="900" fill="#ffffff" text-anchor="end">
    دليل الصحة - ولاية الوادي
  </text>

  <!-- Subtitle -->
  <text x="920" y="255" font-family="Tajawal, sans-serif, 'Segoe UI', Arial" font-size="24" font-weight="600" fill="#94a3b8" text-anchor="end">
    صيدليات المناوبة اليومية • الأطباء والأخصائيون • المستشفيات والعيادات 24/24
  </text>

  <!-- Pulse Line Divider -->
  <path d="M120 300 L550 300 L575 275 L600 325 L625 285 L645 305 L660 300 L1080 300" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- 3 Feature Highlights Columns -->
  <!-- Feature 1: صيدليات المناوبة -->
  <g transform="translate(770, 345)">
    <rect x="0" y="0" width="310" height="135" rx="20" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="235" y="22" width="55" height="55" rx="15" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2"/>
    <!-- Pharmacy Icon -->
    <path d="M262.5 35 V65 M247.5 50 H277.5" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <text x="220" y="48" font-family="Tajawal, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">صيدليات المناوبة</text>
    <text x="220" y="74" font-family="Tajawal, sans-serif" font-size="14" font-weight="500" fill="#6ee7b7" text-anchor="end">محدثة يومياً مع التوقيت المباشر</text>
    <text x="220" y="110" font-family="Tajawal, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="end">عبر 30 بلدية في ولاية الوادي</text>
  </g>

  <!-- Feature 2: الأطباء والعيادات -->
  <g transform="translate(445, 345)">
    <rect x="0" y="0" width="310" height="135" rx="20" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="235" y="22" width="55" height="55" rx="15" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.2"/>
    <!-- Stethoscope/Doctor Icon -->
    <path d="M255 37 V48 C255 56 270 56 270 48 V37 M262.5 54 V62 A6 6 0 1 0 274.5 62 A6 6 0 1 0 262.5 62" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <text x="220" y="48" font-family="Tajawal, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">الأطباء والأخصائيون</text>
    <text x="220" y="74" font-family="Tajawal, sans-serif" font-size="14" font-weight="500" fill="#93c5fd" text-anchor="end">جميع التخصصات الطبية</text>
    <text x="220" y="110" font-family="Tajawal, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="end">أرقام الهواتف والمواعيد والعناوين</text>
  </g>

  <!-- Feature 3: خريطة وتوجيه GPS -->
  <g transform="translate(120, 345)">
    <rect x="0" y="0" width="310" height="135" rx="20" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="235" y="22" width="55" height="55" rx="15" fill="#701a75" fill-opacity="0.3" stroke="#d946ef" stroke-width="1.2"/>
    <!-- Map Pin Icon -->
    <path d="M262.5 35 C254 35 248 41 248 49 C248 58 262.5 68 262.5 68 C262.5 68 277 58 277 49 C277 41 271 35 262.5 35 Z" fill="none" stroke="#e879f9" stroke-width="2.5"/>
    <circle cx="262.5" cy="48" r="3" fill="#e879f9"/>
    <text x="220" y="48" font-family="Tajawal, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="end">خريطة ومسار GPS</text>
    <text x="220" y="74" font-family="Tajawal, sans-serif" font-size="14" font-weight="500" fill="#f0abfc" text-anchor="end">توجيه فوري لأقرب منشأة</text>
    <text x="220" y="110" font-family="Tajawal, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="end">اتصال سريع بزر واحد ومجاناً</text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(120, 510)">
    <!-- URL domain pill -->
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="130" y="22" font-family="sans-serif, Arial" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">sihati-gules.vercel.app</text>

    <!-- PWA Offline Pill -->
    <rect x="280" y="0" width="180" height="34" rx="17" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="370" y="22" font-family="Tajawal, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">⚡ يعمل بدون إنترنت (PWA)</text>

    <!-- 100% Free Pill -->
    <rect x="480" y="0" width="160" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="560" y="22" font-family="Tajawal, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">🇩🇿 مجاني لخدمة المواطن</text>
  </g>
</svg>
